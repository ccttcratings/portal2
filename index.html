<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fce5cd; text-align: center; padding: 8px 24px; margin: 0; }
    .card { background: #fce5cd; max-width: 400px; margin: 0 auto; padding: 6px 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #000; margin-bottom: 42px; font-size: 30px; }
    p { color: #e07474; font-size: 16px; margin-bottom: 30px; }
    .btn { display: block; text-decoration: none; padding: 14px; margin: 12px 0; border-radius: 8px; font-weight: bold; font-size: 20px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .preview { background-color: #c5eec5; color: #573a1e; }
    .edit { background-color: #ffa5a5; color: #573a1e; margin-bottom: 200px; }
    .hub { background-color: #c9daf8; color: #573a1e; }
    .subtext { display: block; font-size: 12px; font-weight: normal; opacity: 0.8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>View Mode Portal</h2>
    <a href="https://docs.google.com/spreadsheets/d/1NdnC1kN831FVfcInOmFBfe-PU5tgKjFh3I-uxPdVGJM/preview" class="btn preview">Preview Mode <span class="subtext">(works on most devices)</span></a>
    <a href="https://docs.google.com/spreadsheets/d/1NdnC1kN831FVfcInOmFBfe-PU5tgKjFh3I-uxPdVGJM/edit?gid=1967667427#gid=1967667427" class="btn edit">Edit Mode <span class="subtext">(annoying banner at top)</span></a>
    <a href="https://ccttcratings.github.io/portalhub/" class="btn hub">Portal Hub<span class="subtext">(hub of redundant portals)</span></a>
  </div>
</body>
</html>
