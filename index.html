<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    font-family: sans-serif;
  }

  #ptr-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }

  #spinner {
    width: 96px;
    height: 96px;
    background-image: url("spinner.svg");
    background-size: contain;
    background-repeat: no-repeat;
    transform-origin: center;
    transition: transform 0.2s ease-out;
    position: absolute;
    left: 50%;
    top: 40px;
    transform: translateX(-50%);
  }

  #spinner.large {
    transform: translateX(-50%) scale(1.0);
  }

  #spinner.spin {
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    from { transform: translateX(-50%) scale(1.0) rotate(0deg); }
    to   { transform: translateX(-50%) scale(1.0) rotate(360deg); }
  }
</style>
</head>

<body>
<div id="ptr-container">
  <div id="spinner" class="spinner"></div>
</div>

<script>
  const spinner = document.getElementById("spinner");
  const container = document.getElementById("ptr-container");

  let isSwiping = false;
  let startY = 0;

  container.addEventListener("touchstart", (e) => {
    startY = e.touches[0].clientY;
    isSwiping = true;

    // Spinner becomes large during swipe
    spinner.classList.add("large");
    spinner.classList.remove("spin");
  });

  container.addEventListener("touchmove", (e) => {
    if (!isSwiping) return;

    const currentY = e.touches[0].clientY;
    const distance = currentY - startY;

    if (distance > 0) {
      // Keep spinner large while swiping
      spinner.classList.add("large");
    }
  });

  container.addEventListener("touchend", () => {
    isSwiping = false;

    // *** RULE: Release should ONLY trigger spin, never size changes ***
    spinner.classList.add("large"); // stays large
    spinner.classList.add("spin");  // starts spinning
  });
</script>

</body>
</html>
