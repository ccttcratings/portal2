  <script>var p=new URLSearchParams(location.search);if(p.has('neon')||(!p.has('normal')&&new Date().getDate()%2)){document.documentElement.classList.add('neon');document.documentElement.setAttribute('data-darkreader-scheme','dark')}</script>
  <style>
    
    html[data-darkreader-scheme="dark"] .hub {
      background: linear-gradient(180deg, #4080d0 0%, #1850a0 50%, #0840a0 100%) !important;
      color: #fff !important;
    }
    html[data-darkreader-scheme="dark"] .graph {
      background: linear-gradient(180deg, #8050c0 0%, #5028a0 50%, #3a1878 100%) !important;
      color: #fff !important;
    }
    
    /* Core Application Layout */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fce5cd; text-align: center; padding: 8px 24px; margin: 0; touch-action: none; }
    
    /* PTR (Pull to Refresh) Styles */
    #ptr { position: fixed; top: 0; left: 50%; width: 64px; height: 64px; margin-left: -32px; margin-top: -68px; z-index: 9999; pointer-events: none; }
    #ptr .bg { fill: #1a1a1a; }
    #ptr .arc { fill: none; stroke: url(#grad); stroke-width: 6; stroke-linecap: round; }
    #ptr .arrow { fill: none; stroke: url(#grad); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    #ptr .face { fill: none; stroke: #e05050; stroke-width: 2; stroke-linecap: round; }
    #ptr .eye { fill: #e05050; }
    #ptr .ring { transform-origin: 32px 32px; }
    #ptr .head, #ptr .tail { transition: opacity 0.15s; }
    #ptr.spin .head, #ptr.spin .tail { opacity: 0; }
    #ptr.spin svg { animation: ptrSpin 0.7s linear infinite; }
    @keyframes ptrSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* Core Application Layout */
    .card { background: #fce5cd; max-width: 400px; margin: 0 auto; padding: 6px 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.0); }
    h2 { color: #000; margin-bottom: 42px; font-size: 30px; }
    p { color: #e07474; font-size: 16px; margin-bottom: 30px; }
    
    /* Glass Button Base - glossy gel + perspective angle */
    .btn {
      position: relative; display: block; text-decoration: none;
      padding: 14px; margin: 20px 0; border-radius: 12px;
      font-weight: bold; font-size: 20px; color: #000;
      transform: perspective(500px) rotateY(-12deg);
      box-shadow: 2px 0 0 4px rgba(0,0,0,.2), 0 6px 0 var(--dark), 0 10px 16px rgba(0,0,0,.35);
      overflow: hidden; border: none;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .btn::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.15) 100%);
      border-radius: 8px 8px 50% 50%; pointer-events: none;
    }
    .btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.3), transparent);
      transition: 0.5s; z-index: 1; pointer-events: none;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover { transform: perspective(500px) rotateY(0deg); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 2px 0 var(--dark), 0 4px 10px rgba(0,0,0,.25); }
    .btn:active { transform: perspective(500px) rotateY(0deg) translateY(2px); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 0 0 var(--dark), 0 2px 6px rgba(0,0,0,.2); }
    
    /* Glass Colors */
    .preview { background: linear-gradient(180deg, #6abf6e 0%, #3a9e3e 40%, #288028 100%); --dark: #1c6a1c; }
    .edit { background: linear-gradient(180deg, #e87070 0%, #c84040 40%, #a02020 100%); --dark: #801818; }
    .hub { background: linear-gradient(180deg, #3ba8d6 0%, #1a7daa 40%, #0e5f80 100%); --dark: #0a4a60; }
    .graph { background: linear-gradient(180deg, #a048a0 0%, #883088 40%, #682068 100%); --dark: #501850; padding: 18px 14px; }
    .graphnew { background: linear-gradient(180deg, #e060a0 0%, #b03070 40%, #902060 100%); --dark: #701850; margin-top: 80px; padding: 18px 14px; }
    
    .subtext { display: block; font-size: 12px; font-weight: normal; opacity: 0.8; margin-top: 4px; }
    
    /* Neon overrides — odd days */
    html.neon .preview { background: linear-gradient(180deg, #00ff00 0%, #00cc00 40%, #009900 100%); --dark: #006600; }
    html.neon .edit { background: linear-gradient(180deg, #ff0000 0%, #cc0000 40%, #990000 100%); --dark: #660000; }
    html.neon .hub { background: linear-gradient(180deg, #0bcade 0%, #09a3b5 40%, #077c9c 100%); --dark: #055f7d; }
    html.neon .graph { background: linear-gradient(180deg, #bf00ff 0%, #9900dd 40%, #7700bb 100%); --dark: #550099; }
    html.neon .graphnew { background: linear-gradient(180deg, #ff33dd 0%, #dd11bb 40%, #bb0099 100%); --dark: #880077; }
    html.neon .btn::after {
      background: linear-gradient(180deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.15) 100%) !important;
    }
    html.neon .preview::after {
      background: linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.2) 100%) !important;
    }
    html.neon body { background: #4e2a05; color-scheme: dark; }
    html.neon .card { background: #4e2a05; }
    html.neon h2 { color: #fff; }
    html.neon p { color: #ffb3b3; }
</style>

  <script>
    // PTR (Pull to Refresh) functionality
    (function() {
      var drag = { active: false, startY: 0, startScroll: 0, history: [], animating: false };
      var friction = 0.999;
      var bounceDecay = 1.0;
      var ptr = document.getElementById('ptr');
      var ptrRing = ptr.querySelector('.ring');
      var audioCtx = null;
      function ensureAudio() {
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }
      function popSound() {
        ensureAudio();
        if (!audioCtx) return;
        var t = audioCtx.currentTime;
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(800, t);
        o.frequency.exponentialRampToValueAtTime(200, t + 0.05);
        g.gain.setValueAtTime(0.5, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        o.start(); o.stop(t + 0.08);
      }
      function bottomBounce() {
        ensureAudio();
        if (!audioCtx) return;
        var t = audioCtx.currentTime;
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(440, t);
        var lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
        lfo.connect(lg); lg.connect(o.frequency);
        lfo.frequency.value = 6; lg.gain.value = 200;
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        o.start(); o.stop(t + 0.8);
        lfo.start(); lfo.stop(t + 0.8);
      }
      function topBounce() {
        ensureAudio();
        if (!audioCtx) return;
        var t = audioCtx.currentTime;
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(80, t);
        o.frequency.exponentialRampToValueAtTime(200, t + 0.05);
        o.frequency.exponentialRampToValueAtTime(40, t + 0.5);
        var lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
        lfo.connect(lg); lg.connect(o.frequency);
        lfo.frequency.value = 10; lg.gain.value = 40;
        g.gain.setValueAtTime(0.5, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        o.start(); o.stop(t + 0.6);
        lfo.start(); lfo.stop(t + 0.6);
      }
      document.addEventListener('click', function(e) {
        if (e.target.closest('.btn, .tinyurl')) popSound();
      });
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        drag.active = true;
        drag.startY = e.touches[0].clientY;
        drag.startScroll = window.scrollY;
        drag.history = [{ y: e.touches[0].clientY, t: Date.now() }];
        drag.animating = false;
        drag.ptrActive = false;
        ptr.className = '';
      }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        if (!drag.active || e.touches.length !== 1) return;
        var dy = drag.startY - e.touches[0].clientY;
        if (drag.startScroll <= 0 && dy < 0) {
          drag.ptrActive = true;
          var dist = Math.min(-dy, 120);
          var pct = Math.min(dist / 80, 1);
          ptr.style.marginTop = (dist - 60) + 'px';
          ptr.style.opacity = pct;
          var rot = Math.min(dist * 3, 360);
          var ptrRing = ptr.querySelector('.ring');
          ptrRing.style.transformOrigin = '32px 32px';
          ptrRing.style.transform = 'rotate(' + rot + 'deg)';
          ptr.className = '';
          return;
        }
        drag.ptrActive = false;
        ptr.className = '';
        ptr.style.marginTop = '';
        ptr.style.opacity = '';
        ptrRing.style.transform = '';
        window.scrollTo(0, drag.startScroll + dy);
        var now = Date.now();
        drag.history.push({ y: e.touches[0].clientY, t: now });
        if (drag.history.length > 8) drag.history.shift();
      }, { passive: true });
      document.addEventListener('touchend', function() {
        if (!drag.active) return;
        drag.active = false;
        if (drag.ptrActive) {
          if (parseFloat(ptr.style.opacity) >= 1) {
            ptr.className = 'spin';
            var ptrRing = ptr.querySelector('.ring');
            ptrRing.style.transform = '';
            popSound();
            setTimeout(function() { location.reload(); }, 750);
          } else {
            ptr.style.marginTop = '';
            ptr.style.opacity = '';
            ptr.className = '';
            var ptrRing = ptr.querySelector('.ring');
            ptrRing.style.transform = '';
          }
          return;
        }
        var h = drag.history;
        if (h.length < 2) return;
        var last = h[h.length - 1], first = h[0];
        var dt = last.t - first.t;
        if (dt <= 0) return;
        var velocity = (first.y - last.y) / dt;
        if (Math.abs(velocity) < 0.3) return;
        startScrollMomentum(velocity);
      }, { passive: true });
      function startScrollMomentum(v) {
        drag.animating = true;
        var lastTime = Date.now();
        var vy = v;
        function step() {
          if (!drag.animating) return;
          var now = Date.now();
          var elapsed = now - lastTime;
          lastTime = now;
          vy *= Math.pow(friction, elapsed / 16);
          if (Math.abs(vy) < 0.01) { drag.animating = false; return; }
          var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          var scroll = window.scrollY;
          var next = scroll + vy * elapsed;
          if (next < 0) { next = 0; vy = -vy * bounceDecay; }
          else if (next > document.documentElement.scrollHeight - window.innerHeight) { next = maxScroll; vy = -vy * bounceDecay; }
          window.scrollTo(0, next);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
    })();
  </script>
