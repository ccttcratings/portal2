<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ----------------------------------------------------
       THE FIX: Intercept Dark Reader's specific runtime engine 
       NOTE: not using prefers-color-scheme — it follows the OS
       theme (which can be dark while nothing darkens the page),
       while this attribute only appears when Dark Reader is
       actually rendering the page dark.
       ---------------------------------------------------- */
    html[data-darkreader-scheme="dark"] .hub {
      background: linear-gradient(180deg, #4080d0 0%, #1850a0 50%, #0840a0 100%) !important;
      color: #fff !important;
    }
    html[data-darkreader-scheme="dark"] .graph {
      background: linear-gradient(180deg, #8050c0 0%, #5028a0 50%, #3a1878 100%) !important;
      color: #fff !important;
    }

    /* Core Application Layout */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fce5cd; text-align: center; padding: 8px 24px; margin: 0; }
    .card { background: #fce5cd; max-width: 400px; margin: 0 auto; padding: 6px 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #000; margin-bottom: 42px; font-size: 30px; }
    p { color: #e07474; font-size: 16px; margin-bottom: 30px; }

    /* Glass Button Base - glossy gel + perspective angle */
    .btn {
      position: relative; display: block; text-decoration: none;
      padding: 14px; margin: 20px 0; border-radius: 12px;
      font-weight: bold; font-size: 20px; color: #000;
      transform: perspective(500px) rotateY(-12deg);
      box-shadow: 2px 0 0 4px rgba(0,0,0,.2), 0 6px 0 var(--dark), 0 10px 16px rgba(0,0,0,.35);
      overflow: hidden; border: none;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .btn::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,.4) 0%, rgba(255,255,255,.05) 100%);
      border-radius: 8px 8px 50% 50%; pointer-events: none;
    }
    .btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.3), transparent);
      transition: 0.5s; z-index: 1; pointer-events: none;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover { transform: perspective(500px) rotateY(0deg); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 2px 0 var(--dark), 0 4px 10px rgba(0,0,0,.25); }
    .btn:active { transform: perspective(500px) rotateY(0deg) translateY(2px); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 0 0 var(--dark), 0 2px 6px rgba(0,0,0,.2); }

    /* Glass Colors */
    .preview { background: linear-gradient(180deg, #4caf50 0%, #2e7d32 40%, #1b5e20 100%); --dark: #145218; }
    .edit { background: linear-gradient(180deg, #f06060 0%, #c02020 40%, #901010 100%); --dark: #700; }
    .hub { background: linear-gradient(180deg, #3ba8d6 0%, #1a7daa 40%, #0e5f80 100%); --dark: #0a4a60; }
    .graph { background: linear-gradient(180deg, #9060d0 0%, #6030a0 40%, #4a2088 100%); --dark: #381870; }
    .graphnew { background: linear-gradient(180deg, #e060a0 0%, #b03070 40%, #902060 100%); --dark: #701850; margin-top: 80px; }

    .subtext { display: block; font-size: 12px; font-weight: normal; opacity: 0.8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>View Mode Portal</h2>
    <a href="https://docs.google.com/spreadsheets/d/1NdnC1kN831FVfcInOmFBfe-PU5tgKjFh3I-uxPdVGJM/preview" class="btn preview">Preview Mode <span class="subtext">(works on most devices)</span></a>
    <a href="https://docs.google.com/spreadsheets/d/1NdnC1kN831FVfcInOmFBfe-PU5tgKjFh3I-uxPdVGJM/edit?gid=1967667427#gid=1967667427" class="btn edit">Edit Mode <span class="subtext">(annoying banner at top)</span></a>
    <a href="https://ccttcratings.github.io/graph/" class="btn graphnew" target="_blank" rel="noopener">New Player Ratings Graph</a>
    <a href="https://script.google.com/macros/s/AKfycbyh4XByirwdUrd4OArgiWHokySt_rgBS1gJMtLRyLJOeLZVHAQDFrQXQXbthd_TxHbx/exec" class="btn graph" target="_blank" rel="noopener">Old Player Ratings Graph</a>
    <a href="https://ccttcratings.github.io/portalhub/" class="btn hub">Portal Hub of Portals<span class="subtext">(hub of redundant portals)</span></a>
  </div>
</body>
</html>
