<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    height: auto;
    overflow-y: visible;
}

body {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
    min-height: 100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#fce5cd;
    text-align:center;
    padding:8px 16px;
    margin:0;

    /* CRITICAL: allow native scroll so URL bar can auto-hide */
    touch-action: pan-y;
}

/* PTR BOX 64×64 */
#ptr {
    position:absolute; /* default: NOT fixed during scroll */
    top:0;
    left:50%;
    width:64px;
    height:64px;
    margin-left:-32px;
    margin-top:-68px;
    z-index:9999;
    pointer-events:none;
    opacity:1;
    transition:opacity .15s;
}

/* Fixed only during PTR pull */
.ptr-fixed {
    position:fixed !important;
}

/* Spinner stays 48×48 but scaled up */
#ptr-svg {
    position:absolute;
    width:48px;
    height:48px;
    top:8px;
    left:8px;
    transform-origin:24px 24px;
    transform:scale(2.4);
}

/* Fletchings visible normally */
#g79 {
    opacity:1;
}

/* Fletchings hidden during spin */
#ptr.spin #g79 {
    opacity:0;
}

/* spin whole image — preserves scale */
#ptr.spin #ptr-svg {
    animation:ptrSpin .7s linear infinite;
    transform:scale(2.4) rotate(0deg);
}

@keyframes ptrSpin {
    from { transform:scale(2.4) rotate(0deg); }
    to   { transform:scale(2.4) rotate(360deg); }
}

.card {
    background:#fce5cd;
    max-width:460px;
    margin:0 auto;
    padding:6px 20px 30px;
    border-radius:12px;
}

h2 {
    color:#000;
    margin-bottom:42px;
    font-size:32px;
}

p {
    color:#e07474;
    font-size:18px;
    margin-bottom:30px;
}

.btn {
    position:relative;
    display:block;
    text-decoration:none;
    padding:18px 16px;
    margin:20px 0;
    border-radius:12px;
    font-weight:bold;
    font-size:24px;
    color:#000;
    transform:perspective(500px) rotateY(-8deg);
    box-shadow:2px 0 0 4px rgba(0,0,0,.2),0 6px 0 var(--dark),0 10px 16px rgba(0,0,0,.35);
    overflow:hidden;
    border:none;
    transition:.4s;
    white-space: nowrap;
    text-overflow: ellipsis;
    width:100%;
    box-sizing:border-box;
}

.btn:hover {
    transform: translateY(-8px);
    box-shadow:0 0 0 4px rgba(0,0,0,.1),0 2px 0 var(--dark),0 4px 10px rgba(0,0,0,.25);
}

.btn::after {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.15));
    border-radius:8px 8px 50% 50%;
}

.btn::before {
    content:'';
    position:absolute;
    top:0; left:-100%;
    width:100%; height:100%;
    background:linear-gradient(to right,transparent,rgba(255,255,255,.3),transparent);
    transition:.5s;
    z-index:1;
}

.btn:hover::before { left:100%; }

.preview { background:linear-gradient(180deg,#6abf6e,#3a9e3e,#288028); --dark:#1c6a1c; }
.edit    { background:linear-gradient(180deg,#e87070,#c84040,#a02020); --dark:#801818; }
.hub     { background:linear-gradient(180deg,#3ba8d6,#1a7daa,#0e5f80); --dark:#0a4a60; }
.graph   { background:linear-gradient(180deg,#a048a0,#883088,#682068); --dark:#501850; padding:20px 16px; }
.graphnew{ background:linear-gradient(180deg,#e060a0,#b03070,#902060); --dark:#701850; margin-top:80px; padding:20px 16px; }

.subtext {
    display:block;
    font-size:14px;
    opacity:.8;
    margin-top:4px;
}

html.neon .preview { background:linear-gradient(180deg,#00ff00,#00cc00,#009900); --dark:#006600; }
html.neon .edit    { background:linear-gradient(180deg,#ff0000,#cc0000,#990000); --dark:#660000; }
html.neon .hub     { background:linear-gradient(180deg,#0bcade,#09a3b5,#077c9c); --dark:#055f7d; }
html.neon .graph   { background:linear-gradient(180deg,#bf00ff,#9900dd,#7700bb); --dark:#550099; }
html.neon .graphnew{ background:linear-gradient(180deg,#ff33dd,#dd11bb,#bb0099); --dark:#880077; }
html.neon body     { background:#4e2a05; color-scheme:dark; }
html.neon .card    { background:#4e2a05; }
html.neon h2       { color:#fff; }
html.neon p        { color:#ffb3b3; }

body::after {
    content: "";
    display: block;
    height: 240px;
}
    
</style>
</head>

<body>

<div class="card">

<!-- PTR SPINNER -->
<div id="ptr">
    <!-- your full SVG remains unchanged -->
    <!-- (I can paste the full SVG if you want it inline again) -->
</div>

<h2>View Mode Portal</h2>

<a href="https://docs.google.com/spreadsheets/d/1NdnC1kN831FVfcInOmFBfe-PU5tgKjFh3I-uxPdVGJM/preview" class="btn preview">
Preview Mode <span class="subtext">(works on most devices)</span>
</a>

<a href="https://docs.google.com/spreadsheets/d/1NdnC1kN831FVfcInOmFBfe-PU5tgKjFh3I-uxPdVGJM/edit?gid=1967667427#gid=1967667427" class="btn edit">
Edit Mode <span class="subtext">(annoying banner at top)</span>
</a>

<a href="https://ccttcratings.github.io/graph/" class="btn graphnew" target="_blank">
Player Ratings Graph
</a>

<a href="https://script.google.com/macros/s/AKfycbyh4XByirwdUrd4OArgiWHokySt_rgBS1gJMtLRyLJOeLZVHAQDFrQXQXbthd_TxHbx/exec"
class="btn graph" target="_blank">
Old Player Ratings Graph
</a>

<a href="https://ccttcratings.github.io/portalhub/" class="btn hub">
Portal Hub of Portals <span class="subtext">(hub of redundant portals)</span>
</a>

</div>

<script>
(function(){
    var params = new URLSearchParams(location.search);
    if (params.has('neon')) {
        document.documentElement.classList.add('neon');
    }
})();

(function(){
var drag={active:false,startY:0,startScroll:0,history:[],animating:false};
var friction=0.999;
var ptr=document.getElementById('ptr');
var ptrSvg=document.getElementById('ptr-svg');
var g1=document.querySelector('#g1');

document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1) return;
    drag.active=true;
    drag.startY=e.touches[0].clientY;
    drag.startScroll=window.scrollY;
    drag.history=[{y:e.touches[0].clientY,t:Date.now()}];
    drag.ptrActive=false;

    ptr.classList.remove("ptr-fixed");
    ptr.className='';
    ptr.style.marginTop='-68px';
    ptrSvg.style.transform='scale(2.4)';
    g1.style.transform='';
},{passive:true});

document.addEventListener('touchmove',function(e){
    if(!drag.active||e.touches.length!==1) return;
    var dy=drag.startY-e.touches[0].clientY;

    if(drag.startScroll<=0 && dy<0){
        drag.ptrActive=true;
        ptr.classList.add("ptr-fixed");

        var dist=Math.min(-dy,120);
        var rawDist = -dy;
        var pct=Math.min(dist/80,1);

        ptr.style.marginTop=(dist-60)+'px';
        ptr.style.opacity=pct;

        ptr.classList.add('swiping');
        ptrSvg.style.transform='scale(2.4)';

        var angle = rawDist * 1.25;
        g1.style.transformOrigin='32px 32px';
        g1.style.transform='rotate('+angle+'deg)';
    } else {
        drag.ptrActive=false;
        ptr.classList.remove("ptr-fixed");
        ptr.classList.remove('swiping');
        ptr.className='';
        ptr.style.marginTop='-68px';
        ptrSvg.style.transform='scale(2.4)';
        g1.style.transform='';
    }

    var now=Date.now();
    drag.history.push({y:e.touches[0].clientY,t:now});
    if(drag.history.length>8) drag.history.shift();
},{passive:true});

document.addEventListener('touchend',function(){
    if(!drag.active) return;
    drag.active=false;

    ptr.classList.remove("ptr-fixed");

    if(drag.ptrActive){
        if(parseFloat(ptr.style.opacity)>=1){

            ptrSvg.style.transform='scale(2.4)';
            ptr.classList.add('spin');

            g1.style.transform='';

            setTimeout(function(){location.reload();},750);

        } else {
            ptr.style.marginTop='-68px';
            ptr.style.opacity=1;
            ptr.className='';
            ptrSvg.style.transform='scale(2.4)';
            g1.style.transform='';
        }
        return;
    }

    var h=drag.history;
    if(h.length<2) return;
    var last=h[h.length-1], first=h[0];
    var dt=last.t-first.t;
    if(dt<=0) return;
    var velocity=(first.y-last.y)/dt;
    if(Math.abs(velocity)<0.3) return;

    startScrollMomentum(velocity);
},{passive:true});

function startScrollMomentum(v){
    drag.animating=true;
    var lastTime=Date.now();
    var vy=v;

    function step(){
        if(!drag.animating) return;
        var now=Date.now();
        var elapsed=now-lastTime;
        lastTime=now;

        vy*=Math.pow(friction,elapsed/16);
        if(Math.abs(vy)<0.01){drag.animating=false;return;}

        var maxScroll=document.documentElement.scrollHeight-window.innerHeight;
        var scroll=window.scrollY;
        var next=scroll+vy*elapsed;

        if(next<0){
            next=0;
            drag.animating=false;
            window.scrollTo(0,next);
            return;
        } else if(next>maxScroll){
            next=maxScroll;
            drag.animating=false;
            window.scrollTo(0,next);
            return;
        }

        window.scrollTo(0,next);
        requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
}
})();
</script>

</body>
</html>
