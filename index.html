<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  var p = new URLSearchParams(location.search);
  if (p.has('neon') || (!p.has('normal') && new Date().getDate() % 2)) {
    document.documentElement.classList.add('neon');
    document.documentElement.setAttribute('data-darkreader-scheme', 'dark');
  }
</script>

<style>
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#fce5cd;
    text-align:center;
    padding:8px 24px;
    margin:0;
    touch-action:none;
  }

  /* PTR BOX 64×64 */
  #ptr {
    position:fixed;
    top:0;
    left:50%;
    width:64px;
    height:64px;
    margin-left:-32px;
    margin-top:-68px;
    z-index:9999;
    pointer-events:none;
    opacity:0;
    transition:opacity .15s;
  }

  /* SVG 48×48 centered */
  #ptr-svg {
    position:absolute;
    width:48px;
    height:48px;
    top:8px;
    left:8px;
    transform-origin:24px 24px;
  }

  /* hide arrow group during swipe */
  #ptr.swiping #ptr-svg #g18 {
    opacity:0;
  }

  /* ONLY CHANGE: spin arrow group on release */
  #ptr.spin #ptr-svg #g18 {
    animation:ptrSpin .7s linear infinite;
  }

  @keyframes ptrSpin {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
  }

  .card {
    background:#fce5cd;
    max-width:400px;
    margin:0 auto;
    padding:6px 20px 30px;
    border-radius:12px;
  }

  h2 { color:#000; margin-bottom:42px; font-size:30px; }
  p  { color:#e07474; font-size:16px; margin-bottom:30px; }

  .btn {
    position:relative;
    display:block;
    text-decoration:none;
    padding:14px;
    margin:20px 0;
    border-radius:12px;
    font-weight:bold;
    font-size:20px;
    color:#000;
    transform:perspective(500px) rotateY(-12deg);
    box-shadow:2px 0 0 4px rgba(0,0,0,.2),0 6px 0 var(--dark),0 10px 16px rgba(0,0,0,.35);
    overflow:hidden;
    border:none;
    transition:.4s;
  }

  .btn::after {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.15));
    border-radius:8px 8px 50% 50%;
  }

  .btn::before {
    content:'';
    position:absolute;
    top:0; left:-100%;
    width:100%; height:100%;
    background:linear-gradient(to right,transparent,rgba(255,255,255,.3),transparent);
    transition:.5s;
    z-index:1;
  }

  .btn:hover::before { left:100%; }
  .btn:hover {
    transform:perspective(500px) rotateY(0deg);
    box-shadow:0 0 0 4px rgba(0,0,0,.1),0 2px 0 var(--dark),0 4px 10px rgba(0,0,0,.25);
  }

  .preview { background:linear-gradient(180deg,#6abf6e,#3a9e3e,#288028); --dark:#1c6a1c; }
  .edit    { background:linear-gradient(180deg,#e87070,#c84040,#a02020); --dark:#801818; }
  .hub     { background:linear-gradient(180deg,#3ba8d6,#1a7daa,#0e5f80); --dark:#0a4a60; }
  .graph   { background:linear-gradient(180deg,#a048a0,#883088,#682068); --dark:#501850; padding:18px 14px; }
  .graphnew{ background:linear-gradient(180deg,#e060a0,#b03070,#902060); --dark:#701850; margin-top:80px; padding:18px 14px; }

  .subtext { display:block; font-size:12px; opacity:.8; margin-top:4px; }

  html.neon .preview { background:linear-gradient(180deg,#00ff00,#00cc00,#009900); --dark:#006600; }
  html.neon .edit    { background:linear-gradient(180deg,#ff0000,#cc0000,#990000); --dark:#660000; }
  html.neon .hub     { background:linear-gradient(180deg,#0bcade,#09a3b5,#077c9c); --dark:#055f7d; }
  html.neon .graph   { background:linear-gradient(180deg,#bf00ff,#9900dd,#7700bb); --dark:#550099; }
  html.neon .graphnew{ background:linear-gradient(180deg,#ff33dd,#dd11bb,#bb0099); --dark:#880077; }
  html.neon body     { background:#4e2a05; color-scheme:dark; }
  html.neon .card    { background:#4e2a05; }
  html.neon h2       { color:#fff; }
  html.neon p        { color:#ffb3b3; }
</style>
</head>
