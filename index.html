<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fce5cd; text-align: center; padding: 40px 20px; margin: 0; }
    .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #c5eec5; margin-bottom: 8px; font-size: 22px; }
    p { color: #ffa5a5; font-size: 14px; margin-bottom: 30px; }
    .btn { display: block; text-decoration: none; padding: 14px; margin: 12px 0; border-radius: 8px; font-weight: bold; font-size: 16px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .preview { background-color: #c5eec5; color: white; }
    .edit { background-color: #ffa5a5; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h2>View Mode Portal</h2>
    <p>Choose one:</p>

    <a href="https://docs.google.com/spreadsheets/d/1NdnC1kN831FVfcInOmFBfe-PU5tgKjFh3I-uxPdVGJM/edit?gid=1967667427#gid=1967667427" class="btn edit">Edit Mode (annoying banner at top</a>
