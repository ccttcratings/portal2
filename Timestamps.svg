<?xml version="1.0" encoding="UTF-8"?>
<svg width="157" height="50" viewBox="0 0 157 50" xmlns="http://www.w3.org/2000/svg">
  <!-- 3x3 Grid: 9 distinct areas, each with exactly ONE fill color -->
  <!-- Grid: 3 cols (52.33px each), 3 rows (16.67px each) -->
  
  <!-- Row 1 (top): y=0 to 16.67 -->
  <rect x="0" y="0" width="52.33" height="16.67" fill="#e9e5f2"/>      <!-- Top-left -->
  <rect x="52.33" y="0" width="52.34" height="16.67" fill="#d9d2e9"/>  <!-- Top-middle -->
  <rect x="104.67" y="0" width="52.33" height="16.67" fill="#e9e5f2"/>  <!-- Top-right -->

  <!-- Row 2 (middle): y=16.67 to 33.33 -->
  <rect x="0" y="16.67" width="52.33" height="16.66" fill="#d9d2e9"/>    <!-- Middle-left -->
  <rect x="52.33" y="0" width="52.34" height="16.66" fill="#e9e5f2"/>  <!-- Center (no purple) -->
  <rect x="104.67" y="0" width="52.33" height="16.66" fill="#d9d2e9"/>  <!-- Middle-right -->

  <!-- Row 3 (bottom): y=33.33 to 50 -->
  <rect x="0" y="33.33" width="52.33" height="16.67" fill="#e9e5f2"/>   <!-- Bottom-left -->
  <rect x="52.33" y="33.33" width="52.34" height="16.67" fill="#e9e5f2"/>  <!-- Bottom-middle (no purple) -->
  <rect x="104.67" y="33.33" width="52.33" height="16.67" fill="#e9e5f2"/>  <!-- Bottom-right -->

  <!-- Inner rectangles (medium and small) - black stroke only, NO FILL -->
  <g fill="none" stroke="#000000" stroke-width="1">
    <rect x="10" y="10" width="137" height="30"/>
    <rect x="15" y="15" width="127" height="20"/>
  </g>

  <!-- Diagonal lines from corners to inner rect corners -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <line x1="0" y1="0" x2="12" y2="12" stroke="#000000" stroke-width="1.5"/>
    <line x1="157" y1="0" x2="145" y2="12" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="12" y2="38" stroke="#000000" stroke-width="1.5"/>
    <line x1="157" y1="50" x2="145" y2="38" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- Centered text -->
  <text x="78.5" y="31.25" text-anchor="middle" letter-spacing="1" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#000000">Timestamps</text>
</svg>